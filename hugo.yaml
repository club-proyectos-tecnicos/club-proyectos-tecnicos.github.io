baseURL: "https://club-proyectos-tecnicos.github.io/"
canonifyURLs: true
relativeURLs: false
defaultContentLanguage: "es"
defaultContentLanguageInSubdir: false

enableRobotsTXT: true

outputs:
  home:
    - "HTML"
    - "RSS"
    - "JSON"
  page:
    - "HTML"
    - "RSS"

pagination:
  pagerSize: 6

markup:
  goldmark:
    renderer:
      unsafe: true

params:
  favicon: "/Logo_2.png"

languages:
  es:
    locale: "es-ES"
    label: "Español"
    title: "Club de Proyectos Técnicos Aplicados"
    weight: 1
    params:
      description: "Club universitario donde estudiantes de grados técnicos aprenden construyendo proyectos reales, documentan su avance y comparten resultados."
      footerText: "Club de Proyectos Técnicos Aplicados — Aprendizaje aplicado, proyectos reales y trabajo en equipo."
    menus:
      main:
        - identifier: home
          name: Inicio
          pageRef: /
          weight: 1
        - identifier: projects
          name: Proyectos
          pageRef: /projects
          weight: 2
        - identifier: fotos
          name: Fotos
          pageRef: /fotos
          weight: 3
        - identifier: about
          name: Sobre el club
          pageRef: /about
          weight: 4
        - identifier: contact
          name: Contacto
          pageRef: /contact
          weight: 5
  en:
    locale: "en-US"
    label: "English"
    title: "Applied Technical Projects Club"
    weight: 2
    params:
      description: "A university club where students in technical degree programs learn by building real projects, documenting their progress and sharing results."
      footerText: "Applied Technical Projects Club — Applied learning, real projects and teamwork."
    menus:
      main:
        - identifier: home
          name: Home
          pageRef: /
          weight: 1
        - identifier: projects
          name: Projects
          pageRef: /projects
          weight: 2
        - identifier: fotos
          name: Photos
          pageRef: /fotos
          weight: 3
        - identifier: about
          name: About the club
          pageRef: /about
          weight: 4
        - identifier: contact
          name: Contact
          pageRef: /contact
          weight: 5
