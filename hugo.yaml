baseURL: "https://club-proyectos-tecnicos.github.io/"
canonifyURLs: true
relativeURLs: false
defaultContentLanguage: "es"
defaultContentLanguageInSubdir: false

enableRobotsTXT: true

outputs:
  home:
    - "HTML"
    - "RSS"
    - "JSON"
  page:
    - "HTML"
    - "RSS"

pagination:
  pagerSize: 6

markup:
  goldmark:
    renderer:
      unsafe: true

params:
  favicon: "/Logo_2.png"

languages:
  es:
    locale: "es-ES"
    label: "Español"
    title: "Club de Proyectos Técnicos Aplicados"
    weight: 1
    params:
      description: "Club universitario donde estudiantes de grados técnicos aprenden construyendo proyectos reales, documentan su avance y comparten resultados."
      footerText: "Club de Proyectos Técnicos Aplicados — Aprendizaje aplicado, proyectos reales y trabajo en equipo."
    menus:
      main:
        - identifier: home
          name: Inicio
          pageRef: /
          weight: 1
        - identifier: portfolio
          name: Portfolio Projects
          url: /en/portfolio/
          weight: 2
        - identifier: about
          name: Sobre el CPTA
          pageRef: /about
          weight: 3
        - identifier: collaborate
          name: Colabora
          url: "/contact/#colabora"
          weight: 4
        - identifier: join
          name: Únete
          url: "/contact/#unete"
          weight: 5
        - identifier: photos
          name: Fotos
          pageRef: /fotos
          weight: 6
      footer:
        - identifier: activities
          name: Actividades
          pageRef: /activities
          weight: 1
        - identifier: photos
          name: Fotos
          pageRef: /fotos
          weight: 2
        - identifier: contact
          name: Contacto
          pageRef: /contact
          weight: 3
  en:
    locale: "en-US"
    label: "English"
    title: "Applied Technical Projects Club"
    weight: 2
    params:
      description: "A university club where students in technical degree programs learn by building real projects, documenting their progress and sharing results."
      footerText: "Applied Technical Projects Club — Applied learning, real projects and teamwork."
    menus:
      main:
        - identifier: home
          name: Home
          pageRef: /
          weight: 1
        - identifier: portfolio
          name: Portfolio Projects
          pageRef: /portfolio
          weight: 2
        - identifier: about
          name: About CPTA
          pageRef: /about
          weight: 3
        - identifier: collaborate
          name: Collaborate
          url: "/en/contact/#collaborate"
          weight: 4
        - identifier: join
          name: Join us
          url: "/en/contact/#join"
          weight: 5
        - identifier: photos
          name: Photos
          pageRef: /fotos
          weight: 6
      footer:
        - identifier: activities
          name: Activities
          pageRef: /activities
          weight: 1
        - identifier: photos
          name: Photos
          pageRef: /fotos
          weight: 2
        - identifier: contact
          name: Contact
          pageRef: /contact
          weight: 3
