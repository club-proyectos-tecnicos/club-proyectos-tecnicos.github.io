{{ define "main" }}
<section class="section">
  <div class="container detail-container">
    <article class="detail-card">
      <header class="page-header">
        <h1>{{ .Title }}</h1>
        <p class="lead">{{ .Date | time.Format ":date_long" }}</p>
      </header>
      <div class="page-content">
        {{ .Content }}
      </div>
      {{ with .Site.GetPage "/ensayos" }}
      <p class="back-link"><a href="{{ .RelPermalink }}">← {{ i18n "back_to_essays" }}</a></p>
      {{ end }}
    </article>
  </div>
</section>
{{ end }}
